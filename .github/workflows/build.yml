name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    # macOS 26 runner: its default Xcode (26.x) is close to the local
    # toolchain, so CI compiles what local builds compile (Xcode 16.4 on the
    # macos-15 image rejected code Swift 6.3+/6.4 accepts). The deployment
    # target stays macOS 15 (LSMinimumSystemVersion 15.0 / Package.swift), so
    # the app still runs on macOS 15. CLT-pinned deps (swift-testing 0.12,
    # KeyboardShortcuts 1.10) resolve via Package.resolved.
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so build-app.sh's `git rev-list --count HEAD` yields the
          # real, monotonic build number (a shallow clone would report 1).
          fetch-depth: 0

      # Import the signing cert into a throwaway keychain. Either the free
      # self-signed "Capture Studio Dev" (scripts/setup-signing-cert.sh) or the
      # Developer ID Application p12 — APPLE_SIGNING_IDENTITY names which.
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::warning::APPLE_CERTIFICATE secret not set — build-app.sh will ad-hoc sign (TCC will re-prompt)."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KP="$(openssl rand -base64 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Developer ID leaf certs chain through this intermediate; without it
          # the identity is "not valid" and codesign can't find it.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          security default-keychain -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Build app
        env:
          CS_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CS_UNIVERSAL: "1"
        run: scripts/build-app.sh release

      # Notarize only when the identity is Developer ID and the App Store
      # Connect API key secrets exist; otherwise ship the self-signed build.
      - name: Write notary API key
        id: notary
        env:
          CS_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          if [[ "${CS_SIGN_IDENTITY:-}" == Developer\ ID\ Application* && -n "${APPLE_API_KEY:-}" ]]; then
            KEY="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY" > "$KEY"
            echo "key_path=$KEY" >> "$GITHUB_OUTPUT"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Not notarizing (needs Developer ID identity + APPLE_API_KEY secrets)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notarize app
        if: steps.notary.outputs.enabled == 'true'
        env:
          APPLE_API_KEY_PATH: ${{ steps.notary.outputs.key_path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: scripts/notarize.sh dist/CaptureStudio.app

      - name: Build DMG
        run: |
          brew install create-dmg
          scripts/make-dmg.sh

      - name: Notarize DMG
        if: steps.notary.outputs.enabled == 'true'
        env:
          CS_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_PATH: ${{ steps.notary.outputs.key_path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: scripts/notarize.sh dist/CaptureStudio-*.dmg

      # Sparkle feed. Must run after the dmg is notarized + stapled (stapling
      # changes the file, which would invalidate the EdDSA signature).
      - name: Build appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "::warning::SPARKLE_PRIVATE_KEY not set — no appcast.xml, installed apps won't see this update."
            exit 0
          fi
          scripts/make-appcast.sh dist/CaptureStudio-*.dmg

      # Tag push: create/attach a draft GitHub Release with the .dmg.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/appcast.xml
          draft: true
          name: Capture Studio ${{ github.ref_name }}
          body: |
            ${{ steps.notary.outputs.enabled == 'true' && 'Signed with Developer ID and notarized by Apple. Universal (Apple silicon + Intel), macOS 15+.' || 'Self-signed build — not Apple-notarized. macOS blocks the first launch ("Not Opened"): open System Settings → Privacy & Security → Open Anyway.' }}

      # Dispatch (no tag): keep the .dmg as a downloadable run artifact for smoke-testing.
      - name: Upload artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: CaptureStudio-dmg
          path: dist/*.dmg
          if-no-files-found: error
